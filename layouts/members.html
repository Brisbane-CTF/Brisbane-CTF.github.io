{{ define "main" }}
	<members>
		<member>
			<img height="200" width="200" src="/icons/players/apender.webp">
			<card>
				<text>
					<name>APender</name>
					<description>ArkArk fan</description>
					<categories>
						<category class="web">web</category>
						<category class="rev">rev</category>
						<category class="crypto">crypto</category>
						<category class="pwn">pwn</category>
						<category class="misc">misc</category>
					</categories>
				</text>
				<a target="_blank" href="http://apendergh.github.io">
					<img height="25" width="25" src="/icons/fontawesome/globe-solid-full.svg">
				</a>
			</card>
		</member>
	</members>
	<style>
		members {
			display: flex;
			flex-wrap: wrap;
			margin-top: 5%;
			margin-bottom: 5%;
			margin-left: 8%;
			margin-right: 8%;
			gap: 50px;
		}
		member {
			display: flex;
			background: #000000;
			width: 600px;
			height: 200px;
		}
		card {
			display: flex;
			justify-content: space-between;
			width: 100%;
			margin-top: 5px;
			margin-right: 5px;
			& text {
				margin-left: 20px;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			& a {
				height: 30px;
				width: 30px;
				display: flex;
				justify-content: center;
				align-items: center;
				& img {
					-webkit-filter: invert(.75);
					filter: invert(.75);
				}
			}
		}
		name, description, categories {
			color: #ffffff;
		}
		name {
			font-size: 30px;
			font-weight: bold;
			text-decoration: underline dotted #3e3e3e;
		}
		description {
			height: 100px;
		}
		category {
			padding: 10px;
			font-weight: bold;
			&.web {
				background: #3d68fd8f;
			}
			&.pwn {
				background: #ff00009e;
			}
			&.rev {
				background: #e99f00c2;
			}
			&.crypto {
				background: #ffff0096;
			}
			&.misc {
				background: purple;
			}
		}

	</style>
{{ end }}
